<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catch the food game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="./js/p5.min.js"></script>
    <script src="./js/sketch.js"></script>
    <div class="game-container">
        <div class="instructions">
            <p>🎮 Тоглох заавар: keyboard-ний
                <span class="game-btn">&lt;</span> <span class="game-btn">&gt;</span> сумаар болон
                <span class="game-btn">A</span> <span class="game-btn">D</span> үсгээр, утсан дээр дэлгэцийн
                доорх сум товчнуудыг дарж баруун, зүүн тийш хөдөлнө.
            </p>
        </div>
        <main></main>
        <div class="controls" id="controls">
            <button class="control-btn" id="btnLeft" aria-label="Зүүн тийш">&#9664;</button>
            <button class="control-btn" id="btnRight" aria-label="Баруун тийш">&#9654;</button>
        </div>
    </div>
</body>

</html>
